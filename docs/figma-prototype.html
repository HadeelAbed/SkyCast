    .condition { font-size:21px;font-weight:700;margin-bottom:12px }

    .hero-summary { margin:20px 0 0;max-width:440px;color:#e5eef8;font-size:13px;line-height:1.7 }

    .hero.sunny .weather-art svg { stroke:#f3c96b }.hero.night .weather-art svg { stroke:#d8eafa }

    .highlight { min-height:134px;padding:20px }

    .highlight-icon svg { width:19px;height:19px }
    .highlight-label { color:var(--muted);font-size:12px;font-weight:700;margin-bottom:4px }
    .highlight-value { font-size:24px;letter-spacing:-.04em;font-weight:800;line-height:1.2 }
    .highlight-context { color:var(--muted);font-size:11px;margin-top:5px }
    .forecast-card { padding:17px 10px;overflow:hidden }
    .hour-scroll { display:flex;gap:4px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-color:#b7ccdd transparent;padding:3px 5px 13px }
    .hour-item { min-width:94px;text-align:center;padding:15px 6px;border-radius:13px;flex:none }

    .progress-track { height:5px;border-radius:20px;background:#e8eef4;margin-top:13px;overflow:hidden }.progress-fill { display:block;height:100%;background:var(--sky);border-radius:20px }

    @keyframes pulse { 50% { opacity:.45 } }
    .loading-block { padding:25px;background:white;border-radius:19px;border:1px solid var(--line) }
    .demo-controls { display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0 0;color:var(--muted);font-size:12px }
    .demo-controls select { background:white;border:1px solid var(--line);color:var(--ink);border-radius:9px;min-height:39px;padding:0 10px;max-width:100% }
    .hidden { display:none!important }
    [dir="rtl"] .brand-mark:after { right:auto;left:8px }
    [dir="rtl"] .hour-scroll { direction:rtl } [dir="rtl"] .sun-dot { transform:translateX(50%) }

    @media(max-width:700px) {

    const missing=state==="missing";
    set("sunrise-value",missing?"—":city.sunrise);set("sunset-value",missing?"—":city.sunset);
    const now=localDate(),minutes=now.getHours()*60+now.getMinutes(),parse=s=>Number(s.slice(0,2))*60+Number(s.slice(3)),start=parse(city.sunrise),end=parse(city.sunset);
    const progress=missing?0:Math.max(0,Math.min(100,(minutes-start)/(end-start)*100));
    $("daylight-fill").style.width=progress+"%";$("sun-dot").style.left=progress+"%";$("sun-dot").classList.toggle("hidden",missing||minutes<start||minutes>end);
    set("sun-note",missing?t("missingSun"):minutes<start||minutes>end?t("nightNote"):`${t("dayProgress")}: ${Math.round(progress)}%`);
  }
  function renderWeather(){
    const date=localDate(),night=date.getHours()<6||date.getHours()>=20,kind=night?"night":city.condition;
    $("hero").className="hero "+(kind==="partly"?"cloudy":kind);
    set("hero-city",cityFull(city));
    set("hero-date",new Intl.DateTimeFormat(locale(),{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit",timeZone:city.tz}).format(new Date()));
    set("hero-temp",temp(city.temp));
    set("weather-heading",conditions[language][kind]);
    set("feels",`${t("feels")} ${temp(city.feel)}`);set("high-low",`${t("high")} ${temp(city.high)}  ·  ${t("low")} ${temp(city.low)}`);
    const summaryKey={partly:"summaryPartly",sunny:"summarySunny",cloudy:"summaryCloudy",rainy:"summaryRainy",windy:"summaryWindy",night:"summaryNight"}[kind];
    set("hero-summary",t(summaryKey));set("summary-copy",state==="missing"?t("missingSummary"):t(summaryKey));
    $("weather-art").innerHTML=icon(icons[kind]);
    renderHighlights();renderHourly();renderWeekly();renderSun();refreshIcons();
  }
  const stateKeys=["loaded","initial","auto","searching","notFound","permission","denied","locLoading","locSuccess","unavailable","network","api","missing"];
  function setState(next){state=next;$("demo-state").value=next;renderState()}
  function renderState(){
    const loading=state==="initial"||state==="locLoading",problem=["notFound","denied","unavailable","network","api","searching"].includes(state),notice=["permission","locSuccess"].includes(state);
    $("weather-view").classList.toggle("hidden",loading);
    $("loading-view").classList.toggle("hidden",!loading);
    $("state-message").classList.toggle("hidden",!(problem||notice));
    if(problem||notice){
      const key={notFound:"notFound",denied:"denied",unavailable:"unavailable",network:"network",api:"api",searching:"searching",permission:"permission",locSuccess:"locSuccess"}[state];
      set("state-title",t(key+"Title"));set("state-description",t(key+"Body"));
      $("retry-button").classList.toggle("hidden",state==="permission"||state==="locSuccess");
      set("retry-button",t("retry"));
    }
    $("location-panel").classList.toggle("hidden",state!=="permission");
    if(state==="permission")renderLocationPanel();
    if(state==="auto"){suggestionOpen=true;renderSuggestions()}
    else if(state!=="loaded"&&state!=="missing"){suggestionOpen=false;renderSuggestions()}
    if(state==="missing")renderWeather();
  }
  function renderLocationPanel(){
    set("location-title",t("permissionTitle"));set("location-description",t("permissionBody"));
    const actions=$("location-actions");actions.replaceChildren();
    [["allow",()=>{city=cities[0];setState("locSuccess");renderWeather()}],["deny",()=>setState("denied")],["manual",()=>{setState("loaded");$("city-search").focus();suggestionOpen=true;renderSuggestions()}]].forEach(([key,fn])=>{const b=document.createElement("button");b.type="button";b.className="mini-btn";b.textContent=t(key);b.addEventListener("click",fn);actions.append(b)});
  }
  function render(){
    document.documentElement.lang=language;document.documentElement.dir=language==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
    set("search-label",t("search"));$("city-search").placeholder=t("search");
    $("clear-search").setAttribute("aria-label",t("clear"));
    set("location-button-label",t("location"));set("language-switch",language==="en"?"العربية":"English");
    set("unit-switch",unit==="C"?"°C / °F":"°F / °C");
    $("unit-switch").setAttribute("aria-label",unit==="C"?"Switch to Fahrenheit":"Switch to Celsius");
    set("eyebrow",t("eyebrow"));set("page-title",t("title"));set("tagline",t("tagline"));set("sample-badge",t("sample"));
    ["highlights","hourly","weekly","sunrise","sunset"].forEach(key=>{const id={highlights:"highlights-heading",hourly:"hourly-heading",weekly:"weekly-heading",sunrise:"sunrise-label",sunset:"sunset-label"}[key];set(id,t(key))});
    set("highlights-caption",t("snapshot"));set("hourly-caption",t("next24"));set("weekly-caption",t("weekCaption"));
    set("sun-heading",t("sunTitle"));set("summary-heading",t("summaryTitle"));
    set("about-heading",t("about"));set("about-copy",t("aboutCopy"));set("footer-description",t("footer"));
    set("footer-language",language==="en"?"العربية":"English");set("footer-about",t("about"));set("footer-privacy",t("privacy"));
    set("privacy",t("privacyCopy"));set("demo-label",t("demo"));
    $("attribution").replaceChildren(document.createTextNode(t("attribution")+" "));
    const link=document.createElement("a");link.href="https://open-meteo.com/";link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open-Meteo";$("attribution").append(link,document.createTextNode("."));
    const previous=$("demo-state").value;$("demo-state").replaceChildren();
    stateKeys.forEach(key=>{const option=document.createElement("option");option.value=key;option.textContent=t(key);$("demo-state").append(option)});
    $("demo-state").value=previous||state;
    $("hourly-list").setAttribute("aria-label",t("hourly"));
    renderWeather();renderState();renderSuggestions();
  }
  $("city-search").addEventListener("input",()=>{suggestionOpen=true;if(state==="notFound"||state==="searching")setState("loaded");renderSuggestions()});
  $("city-search").addEventListener("focus",()=>{suggestionOpen=true;renderSuggestions()});
  $("city-search").addEventListener("keydown",e=>{
    if(e.key==="Escape"){suggestionOpen=false;renderSuggestions()}
    if(e.key==="Enter"){e.preventDefault();const q=e.currentTarget.value.trim().toLocaleLowerCase();const match=cities.find(c=>[c.en,c.ar,c.region,c.country].some(v=>v.toLocaleLowerCase()===q))||cities.find(c=>[c.en,c.ar,c.region,c.country].some(v=>v.toLocaleLowerCase().includes(q)));if(match)selectCity(match);else if(q)setState("notFound")}
    if(e.key==="ArrowDown"&&suggestionOpen){e.preventDefault();$("suggestions").querySelector("button")?.focus()}
  });
  $("suggestions").addEventListener("keydown",e=>{if(e.key==="Escape"){$("city-search").focus();suggestionOpen=false;renderSuggestions()}});
  document.addEventListener("click",e=>{if(!$("search-wrap").contains(e.target)){suggestionOpen=false;renderSuggestions()}});
  $("clear-search").addEventListener("click",()=>{$("city-search").value="";$("city-search").focus();suggestionOpen=true;renderSuggestions()});
  $("language-switch").addEventListener("click",()=>{language=language==="en"?"ar":"en";render()});
  $("footer-language").addEventListener("click",()=>{language=language==="en"?"ar":"en";render()});
  $("unit-switch").addEventListener("click",()=>{unit=unit==="C"?"F":"C";render()});
  $("location-button").addEventListener("click",()=>setState("permission"));
  $("retry-button").addEventListener("click",()=>setState("loaded"));
  $("demo-state").addEventListener("change",e=>{setState(e.target.value);if(state==="locSuccess"){city=cities[0];renderWeather()}});
  render();
})();
</script>
 
</body></html>
